name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: VERSION=${{ github.ref_name }} scripts/build.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ## Install

          macOS, Linux, FreeBSD:

          ```sh
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | sh
          ```

          Or download the archive for your platform below, extract it, and put `tome` on your `PATH`:

          | Platform | Archive |
          |---|---|
          | macOS (Apple Silicon) | `darwin_arm64.tar.gz` |
          | macOS (Intel) | `darwin_amd64.tar.gz` |
          | Linux x86-64 / ARM64 | `linux_amd64.tar.gz` / `linux_arm64.tar.gz` |
          | Windows x86-64 / ARM64 | `windows_amd64.zip` / `windows_arm64.zip` |
          | FreeBSD | `freebsd_amd64.tar.gz` |

          Verify a download with `checksums.txt` (`shasum -a 256 -c checksums.txt --ignore-missing`).
          NOTES
          gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --notes-file notes.md --generate-notes
